<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Battery Charge Planner</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <h1>Battery Charge Planner</h1>
      <p class="subtitle">
        Get a simple battery recommendation based on electricity price and
        current charge level.
      </p>
      <div class="card">
        <label for="batteryLevel">Battery level (%)</label>
        <input
          id="batteryLevel"
          type="number"
          min="0"
          max="100"
          placeholder="Example: 40"
        />

        <label for="electricityPrice">Electricity price (kr/kWh)</label>
        <input
          id="electricityPrice"
          type="number"
          step="0.01"
          placeholder="Example: 0.80"
        />

        <button onclick="getRecommendation()">Get recommendation</button>
      </div>

      <div id="result" class="result hidden"></div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
